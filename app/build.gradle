plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novaphantom.gat'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.novaphantom.gat'
        minSdk 26            // AAudio for the sound, OpenGL ES 3.0 for the renderer
        targetSdk 35
        versionCode 1
        versionName '0.1'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'   // phones, and the emulator on a PC
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    buildTypes {
        release {
            // debug-signed so `./gradlew assembleRelease` installs without a keystore; swap in your own to publish
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
}
